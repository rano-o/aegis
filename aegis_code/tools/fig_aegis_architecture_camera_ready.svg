<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#344054"/>
    </marker>
    <style>
      .h1{font:700 26px "Arial", sans-serif; fill:#111827}
      .h2{font:700 17px "Arial", sans-serif; fill:#111827}
      .tx{font:500 13px "Arial", sans-serif; fill:#1f2937}
      .cp{font:600 12px "Arial", sans-serif; fill:#111827}
      .cap{font:500 12px "Arial", sans-serif; fill:#374151}
      .box{stroke:#1f2937; stroke-width:1.7}
      .arr{stroke:#344054; stroke-width:2.4; fill:none; marker-end:url(#arrow)}
      .dash{stroke-dasharray:6 5}
    </style>
  </defs>

  <!-- background -->
  <rect x="20" y="20" width="1160" height="500" rx="14" ry="14" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.2"/>
  <text class="h1" x="42" y="58">Aegis: Design and Implementation Pipeline</text>

  <!-- Trust boundary grouping -->
  <rect x="36" y="92" width="1128" height="340" rx="12" ry="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.0"/>
  <rect x="42" y="98" width="860" height="326" rx="10" ry="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.1"/>
  <text class="cp" x="56" y="118">Core Aegis Pipeline</text>
  <rect x="910" y="98" width="246" height="326" rx="10" ry="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.1"/>
  <text class="cp" x="924" y="118">Assurance Layer</text>

  <!-- main modules -->
  <rect class="box" x="62" y="150" width="190" height="210" fill="#dbeafe"/>
  <text class="h2" x="78" y="178">Input Parsing</text>
  <text class="tx" x="78" y="203">Solidity sources</text>
  <text class="tx" x="78" y="222">Entry discovery</text>
  <text class="tx" x="78" y="241">CFG / DFG / CG facts</text>

  <rect class="box" x="286" y="150" width="230" height="210" fill="#ccfbf1"/>
  <text class="h2" x="302" y="178">VOIR Builder</text>
  <text class="tx" x="302" y="203">Auth semantics</text>
  <text class="tx" x="302" y="222">Caller binding</text>
  <text class="tx" x="302" y="241">Nonce semantics</text>
  <text class="tx" x="302" y="260">Hash binding</text>
  <text class="tx" x="302" y="279">Result semantics</text>

  <rect class="box" x="550" y="150" width="320" height="210" fill="#e9d5ff"/>
  <text class="h2" x="566" y="178">Checker Engine (6 Families)</text>
  <text class="tx" x="566" y="203">C1 Authorization Omission</text>
  <text class="tx" x="566" y="222">C2 Nonce Validation Omission</text>
  <text class="tx" x="566" y="241">C3 Incorrect Success Signaling</text>
  <text class="tx" x="566" y="260">C4 Intent-Hash Mismatch</text>
  <text class="tx" x="566" y="279">C5 Nonce Progression Failure</text>
  <text class="tx" x="566" y="298">C6 Caller-Binding Failure</text>

  <!-- assurance modules -->
  <rect class="box" x="930" y="150" width="206" height="94" fill="#fee2e2"/>
  <text class="h2" x="946" y="178">Formal Alignment</text>
  <text class="tx" x="946" y="202">O_i / Viol_i checks</text>
  <text class="tx" x="946" y="220">Definition consistency</text>

  <rect class="box" x="930" y="266" width="206" height="94" fill="#dcfce7"/>
  <text class="h2" x="946" y="294">Finding Output</text>
  <text class="tx" x="946" y="318">Typed vulnerability</text>
  <text class="tx" x="946" y="336">Evidence + source anchors</text>

  <!-- arrows -->
  <path class="arr" d="M252 255 L286 255"/>
  <path class="arr" d="M516 255 L550 255"/>
  <path class="arr" d="M870 210 L930 197"/>
  <path class="arr" d="M870 300 L930 312"/>

  <!-- goal chips -->
  <rect x="250" y="392" width="146" height="26" rx="13" ry="13" fill="#dbeafe" stroke="#93c5fd"/>
  <text class="cp" x="270" y="410">Semantic Alignment</text>
  <rect x="412" y="392" width="108" height="26" rx="13" ry="13" fill="#ccfbf1" stroke="#5eead4"/>
  <text class="cp" x="434" y="410">IR-only</text>
  <rect x="536" y="392" width="142" height="26" rx="13" ry="13" fill="#ede9fe" stroke="#c4b5fd"/>
  <text class="cp" x="556" y="410">Auditability</text>

  <!-- caption inside canvas for preview -->
  <text class="cap" x="42" y="462">Figure 4.1. Camera-ready architecture: compact module view for two-column layout. Core pipeline converts source code</text>
  <text class="cap" x="42" y="480">into VOIR semantic facts and runs six formally derived checkers, with explicit formal-alignment and auditable output layers.</text>
</svg>
