<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#374151"/>
    </marker>
    <style>
      .title { font: 700 34px Inter, Arial, sans-serif; fill:#111827; }
      .label { font: 700 22px Inter, Arial, sans-serif; fill:#111827; }
      .sub { font: 500 17px Inter, Arial, sans-serif; fill:#1f2937; }
      .chip { font: 600 15px Inter, Arial, sans-serif; fill:#111827; }
      .box { stroke:#1f2937; stroke-width:2.1; rx:14; ry:14; }
      .arrow { stroke:#374151; stroke-width:3; fill:none; marker-end:url(#arrow); }
      .small { font: 500 14px Inter, Arial, sans-serif; fill:#374151; }
    </style>
  </defs>

  <rect x="22" y="22" width="1556" height="476" rx="18" ry="18" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.6"/>

  <text class="title" x="52" y="70">Aegis Architecture</text>

  <!-- Pipeline boxes -->
  <rect class="box" x="52"  y="130" width="300" height="240" fill="#eff6ff"/>
  <rect class="box" x="420" y="130" width="300" height="240" fill="#ecfeff"/>
  <rect class="box" x="788" y="130" width="360" height="240" fill="#f5f3ff"/>
  <rect class="box" x="1216" y="130" width="320" height="240" fill="#f0fdf4"/>

  <!-- Box 1 -->
  <text class="label" x="80" y="172">Input & Parsing</text>
  <text class="sub" x="80" y="206">ERC-4337 Solidity code</text>
  <text class="sub" x="80" y="232">Validation-entry discovery</text>
  <text class="sub" x="80" y="258">CFG / DFG / Call facts</text>

  <!-- Box 2 -->
  <text class="label" x="448" y="172">VOIR Builder</text>
  <text class="sub" x="448" y="206">Semantic fact normalization</text>
  <text class="sub" x="448" y="232">Auth / Caller / Nonce</text>
  <text class="sub" x="448" y="258">Hash-bind / Result semantics</text>

  <!-- Box 3 -->
  <text class="label" x="816" y="172">Checker Engine</text>
  <text class="sub" x="816" y="206">C1 Auth Omission</text>
  <text class="sub" x="816" y="228">C2 Nonce Ref Omission</text>
  <text class="sub" x="816" y="250">C3 Incorrect Success</text>
  <text class="sub" x="816" y="272">C4 Intent-Hash Mismatch</text>
  <text class="sub" x="816" y="294">C5 Nonce Progress Failure</text>
  <text class="sub" x="816" y="316">C6 Caller-Binding Failure</text>

  <!-- Box 4 -->
  <text class="label" x="1244" y="172">Findings</text>
  <text class="sub" x="1244" y="206">Typed vulnerability report</text>
  <text class="sub" x="1244" y="232">Evidence trace + anchors</text>
  <text class="sub" x="1244" y="258">Audit-ready output</text>

  <!-- Arrows -->
  <path class="arrow" d="M352 250 L420 250"/>
  <path class="arrow" d="M720 250 L788 250"/>
  <path class="arrow" d="M1148 250 L1216 250"/>

  <!-- Goal chips -->
  <rect x="420" y="396" width="170" height="42" rx="21" ry="21" fill="#dbeafe" stroke="#93c5fd"/>
  <text class="chip" x="447" y="423">Semantic alignment</text>

  <rect x="620" y="396" width="156" height="42" rx="21" ry="21" fill="#ccfbf1" stroke="#5eead4"/>
  <text class="chip" x="651" y="423">IR-only logic</text>

  <rect x="806" y="396" width="178" height="42" rx="21" ry="21" fill="#ede9fe" stroke="#c4b5fd"/>
  <text class="chip" x="834" y="423">Auditable evidence</text>

  <text class="small" x="52" y="474">Figure 4.1. Compact architecture of Aegis: source code is transformed into VOIR semantic facts and checked by six formally derived detectors.</text>
</svg>
